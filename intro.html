<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Women</title>

    <!-- Tailwind local -->
    <link rel="stylesheet" href="tailwind/tailwind.css">

    <!-- Tailwind CDN temporal

    <link rel="stylesheet" href="css/output.css">

<body class="bg-black text-white overflow-hidden">

    <section id="intro" class="w-full h-screen flex flex-col justify-center items-center text-center px-6">

        </p>

        <button id="enter-btn"
                class="mt-12 px-8 py-3 border border-white text-sm tracking-widest uppercase opacity-0 hover:bg-white hover:text-black transition">
            Entrar
