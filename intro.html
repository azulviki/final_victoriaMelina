<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro – Mujeres en la Música Electrónica</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/output.css">
</head>

<body class="bg-black text-white overflow-hidden">

    <main class="relative w-screen h-screen">

        <!-- Audio -->
        <audio id="intro-audio"></audio>

        <!-- Imágenes -->
        <div id="intro-img" class="absolute inset-0">
            <img src="img/pioneras/1.jpg" class="intro-img">
            <img src="img/pioneras/2.jpg" class="intro-img">
            <img src="img/pioneras/3.jpg" class="intro-img">
            <img src="img/pioneras/4.jpg" class="intro-img">
            <img src="img/pioneras/5.jpg" class="intro-img">
            <img src="img/pioneras/6.jpg" class="intro-img">
            <img src="img/pioneras/7.jpg" class="intro-img">
            <img src="img/pioneras/8.jpg" class="intro-img">
            <img src="img/pioneras/9.jpg" class="intro-img">
        </div>

        <!-- Osciloscopio -->
        <canvas id="synth-wave"
            class="absolute inset-0 w-full h-full opacity-40 pointer-events-none z-10">
        </canvas>

        <!-- Texto -->
        <div id="intro-text"
            class="absolute inset-0 flex flex-col items-center justify-center
                   opacity-0 transition-opacity duration-1000 text-center z-20">

            <h1 class="text-3xl md:text-5xl tracking-widest font-bold">
                MUJERES EN LA<br>MÚSICA ELECTRÓNICA
            </h1>

            <button id="hear-btn"
                class="mt-6 px-6 py-3 border border-cyan-400 text-cyan-400
                       hover:bg-cyan-400 hover:text-black transition">
                OÍR
            </button>

            <a href="index.html"
               class="mt-4 text-sm opacity-60 hover:opacity-100">
               Entrar sin sonido
            </a>

        </div>

    </main>

    <script src="js/intro.js"></script>
</body>

</html>
