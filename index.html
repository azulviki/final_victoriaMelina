<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro – Mujeres en la Música Electrónica</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/output.css">
</head>

<body class="bg-black text-white">

    <main class="relative w-full min-h-screen flex items-center justify-center overflow-hidden">

        <!-- Audio -->
        <audio id="intro-audio"></audio>

        <!-- Imágenes -->
        <div id="intro-img" class="absolute inset-0">
            <img src="img/pioneras/1.jpg" class="intro-img">
            <img src="img/pioneras/2.jpg" class="intro-img">
            <img src="img/pioneras/3.jpg" class="intro-img">
            <img src="img/pioneras/4.jpg" class="intro-img">
            <img src="img/pioneras/5.jpg" class="intro-img">
            <img src="img/pioneras/6.jpg" class="intro-img">
            <img src="img/pioneras/7.jpg" class="intro-img">
            <img src="img/pioneras/8.jpg" class="intro-img">
            <img src="img/pioneras/9.jpg" class="intro-img">
        </div>

        <!-- Osciloscopio -->
        <canvas id="synth-wave"
            class="absolute inset-0 w-full h-full opacity-40 pointer-events-none z-10">
        </canvas>

        <!-- Texto -->
        <div id="intro-text"
     class="absolute inset-0 flex flex-col items-center justify-center
            w-full h-full px-4
            text-center
            opacity-0 scale-90
            transition-all duration-1000 z-30">




    <h1 class="text-4xl sm:text-5xl md:text-6xl
               tracking-widest font-bold
               leading-tight
               text-center w-full">
        MUJERES<br>ELECTRÓNICAS
    </h1>

    <button id="hear-btn"
    class="mt-6 px-6 py-2 text-purple-300
           border-2 border-purple-500 rounded-full font-bold tracking-wider
           bg-purple-600/20
           shadow-lg
           transition-all duration-300">
    OÍR
</button>





    <a href="home.html"
       class="mt-4 text-base opacity-60 hover:opacity-100">
        Entrar
    </a>

</div>


    </main>

    <script src="js/intro.js"></script>
</body>

</html>
